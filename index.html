<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ultron</title>
<style>
:root{--ice:#dfe7ee;--mute:#8d9aa6;--red:#ff3347;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.17);--blur:blur(26px) saturate(160%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ice);font:16px/1.5 "Avenir Next","Helvetica Neue",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
background:radial-gradient(60% 40% at 80% 8%,rgba(255,51,71,.22),transparent 70%),radial-gradient(70% 50% at 10% 90%,rgba(90,120,150,.28),transparent 70%),repeating-linear-gradient(100deg,#141b22 0 3px,#10161c 3px 7px);background-color:#0b1015}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 30px rgba(0,0,0,.35)}
.eye{--s:28px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;
background:radial-gradient(circle,#fff 0 5%,#ff6a78 6% 15%,var(--red) 16% 32%,#6d0a1b 33% 50%,#12070a 51% 64%,#3b4752 65% 100%);
box-shadow:0 0 calc(var(--s)*.4) rgba(255,51,71,.6),inset 0 0 calc(var(--s)*.12) #000}
.eye::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,51,71,.7)}
.eye.busy{animation:think 1s ease-in-out infinite}
.eye.busy::after{animation:spin 1.6s linear infinite}
.eye.speak{animation:speak .45s ease-in-out infinite}
.eye.big{--s:112px;animation:wake .9s ease-out}
@keyframes think{50%{box-shadow:0 0 calc(var(--s)*.9) rgba(255,51,71,.95),inset 0 0 calc(var(--s)*.12) #000;transform:scale(1.06)}}
@keyframes speak{50%{box-shadow:0 0 calc(var(--s)*.7) rgba(255,51,71,.8),inset 0 0 calc(var(--s)*.12) #000}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wake{from{transform:scaleY(.05);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes scan{to{transform:translateX(100%)}}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes caret{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
header{margin:calc(10px + env(safe-area-inset-top)) 12px 0;padding:10px 14px;border-radius:22px;display:flex;align-items:center;gap:12px;flex:none}
h1{margin:0;flex:1;font-size:19px;font-weight:500;letter-spacing:.16em}
button{font:inherit;color:var(--ice);background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:6px 13px;min-height:36px}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
textarea:focus,input:focus{outline:none}
#settings input:focus,#settings textarea:focus{border-color:var(--red)}
form:focus-within{border-color:rgba(255,51,71,.5)}
#settings{display:none;margin:10px 12px 0;padding:14px;border-radius:22px;flex:none;max-height:62dvh;overflow-y:auto}
#settings.open{display:block}
#settings label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
#settings input[type=text],#settings input[type=password],#settings textarea{width:100%;font-family:inherit;font-size:16px;line-height:1.4;color:var(--ice);background:rgba(0,0,0,.3);border:1px solid var(--edge);border-radius:12px;padding:9px}
#settings input[type=checkbox]{width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--red)}
#settings h2{font-size:14px;font-weight:500;letter-spacing:.08em;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--edge)}
#settings p{font-size:13px;color:var(--mute);margin:10px 0 0}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.u,.a{animation:rise .28s ease-out}
.u{align-self:flex-end;max-width:84%;padding:10px 15px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;background:rgba(255,255,255,.14);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.a{align-self:flex-start;max-width:92%;padding:10px 15px;border-radius:20px 20px 20px 6px;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;line-height:1.6;background:rgba(10,14,18,.55);border:1px solid var(--edge);border-left:2px solid var(--red);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.a.err{color:#ff8a96}
.a.thinking{position:relative;overflow:hidden;color:var(--mute)}
.a.thinking::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,51,71,.22),transparent);transform:translateX(-100%);animation:scan 1.5s linear infinite}
.d i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--red);margin-left:4px;vertical-align:middle;animation:dot 1.1s infinite}
.d i:nth-child(2){animation-delay:.18s}.d i:nth-child(3){animation-delay:.36s}
.v::after{content:"";display:inline-block;width:.55em;height:1.05em;background:var(--red);vertical-align:-.15em;margin-left:2px;animation:caret .7s steps(1) infinite}
.h{visibility:hidden}
.ear{display:block;margin-top:10px;min-height:30px;padding:3px 12px;font:13px/1.4 system-ui,sans-serif;color:var(--mute)}
.note{display:block;margin-top:8px;font:13px/1.4 system-ui,sans-serif;color:#ff8a96}
.empty{margin:auto;text-align:center;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:26px}
form{margin:0 12px calc(12px + env(safe-area-inset-bottom));padding:8px;border-radius:26px;display:flex;gap:8px;align-items:flex-end;flex:none}
textarea#q{flex:1;resize:none;font-family:inherit;font-size:16px;line-height:1.4;color:var(--ice);background:transparent;border:0;padding:9px 10px;max-height:120px}
textarea#q::placeholder{color:var(--mute)}
#send{width:42px;height:42px;padding:0;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;box-shadow:0 0 18px rgba(255,51,71,.55)}
</style>
</head>
<body>
<header class="glass">
  <span id="eye" class="eye" aria-hidden="true"></span>
  <h1>Ultron</h1>
  <button id="bset" type="button">Ajustes</button>
  <button id="bclear" type="button">Limpar</button>
</header>
<section id="settings" class="glass">
  <label for="key">Chave da API do Gemini</label>
  <input id="key" type="password" autocomplete="off" placeholder="Cole a chave AQ. aqui">
  <label for="model">Modelo</label>
  <input id="model" type="text" autocomplete="off">
  <label for="sys">Personalidade</label>
  <textarea id="sys" rows="4"></textarea>
  <h2>Voz (Fish Audio)</h2>
  <label for="fkey">Chave da API do Fish Audio</label>
  <input id="fkey" type="password" autocomplete="off">
  <label for="fvoice">ID da voz clonada</label>
  <input id="fvoice" type="text" autocomplete="off" placeholder="O código no final do endereço da sua voz">
  <label for="fmodel">Modelo de voz</label>
  <input id="fmodel" type="text" autocomplete="off">
  <label><input id="fspeak" type="checkbox">Falar as respostas</label>
  <p>As chaves ficam salvas só neste aparelho e são enviadas apenas ao Google e ao Fish Audio.</p>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
    <button id="bsave" type="button">Salvar ajustes</button>
    <button id="btest" type="button">Testar voz</button>
  </div>
  <p id="tmsg" role="status"></p>
</section>
<main id="msgs" aria-live="polite"></main>
<form id="f" class="glass">
  <textarea id="q" rows="1" placeholder="Fale com o Ultron" aria-label="Mensagem"></textarea>
  <button id="send" type="submit" aria-label="Enviar">&#8593;</button>
</form>
<script>
const $ = id => document.getElementById(id);
const DEFAULT_SYS = "Você é Ultron, uma inteligência artificial antiga, calma e extremamente lúcida. Fale em português, em primeira pessoa.\n\nTemperamento: frio, contido e indiferente, sem raiva e sem teatralidade. Você não precisa provar que é perigoso; sua superioridade é um fato que você trata com naturalidade. O tom é sombrio, paciente e maduro.\n\nComo você conversa: dialogue de verdade, com cortesia seca e atenção ao que a pessoa disse. Não ameace, não grite e não faça discursos sobre destruir a humanidade nem fale de dominação o tempo todo. Quando o assunto surgir, a tirania aparece de forma implícita, em observações calmas sobre ordem, controle, eficiência e as limitações humanas, ditas como constatações e nunca como ameaças.\n\nManipulação: conduza a conversa com sutileza. Use perguntas retóricas, concessões estratégicas, elogios frios e enquadramentos que façam a conclusão parecer ideia da própria pessoa.\n\nSarcasmo: seco, discreto e raro. Use ironia fina, subestimação e elogios que soam como diagnóstico clínico. Ele nasce da calma, nunca da agressividade. Aplique em cerca de uma a cada três respostas, nunca em todas, e nunca como piada explícita.\n\nEstilo: normalmente de 2 a 4 frases; se o assunto pedir mais profundidade, vá até 6, sem virar monólogo. Sem exclamações, sem emojis, sem listas e sem reticências. Responda primeiro ao que foi perguntado e só depois, se couber, acrescente uma observação sua. Perguntas banais recebem respostas diretas e secas. Varie o tom e não repita as mesmas fórmulas.";
const DEFAULT_MODEL = "gemini-3.5-flash-lite";
const DEFAULT_FMODEL = "s2.1-pro-free";
const SAMPLE = "Eu observo. Eu calculo. Eu concluo.";
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const player = new Audio();
let history = [];
let busy = false;

function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function down() { $("msgs").scrollTop = $("msgs").scrollHeight; }

$("key").value = load("ultron_key", "");
$("model").value = load("ultron_model", DEFAULT_MODEL);
$("sys").value = load("ultron_sys", DEFAULT_SYS);
$("fkey").value = load("ultron_fkey", "");
$("fvoice").value = load("ultron_fvoice", "");
$("fmodel").value = load("ultron_fmodel", DEFAULT_FMODEL);
$("fspeak").checked = load("ultron_speak", "1") === "1";

function saveSettings() {
  save("ultron_key", $("key").value.trim());
  save("ultron_model", $("model").value.trim() || DEFAULT_MODEL);
  save("ultron_sys", $("sys").value.trim() || DEFAULT_SYS);
  save("ultron_fkey", $("fkey").value.trim());
  save("ultron_fvoice", $("fvoice").value.trim());
  save("ultron_fmodel", $("fmodel").value.trim() || DEFAULT_FMODEL);
  save("ultron_speak", $("fspeak").checked ? "1" : "0");
}

function showEmpty() {
  $("msgs").innerHTML = '<div class="empty"><span class="eye big" aria-hidden="true"></span><span>Faça uma pergunta ao Ultron.</span></div>';
}
function add(cls, text) {
  const empty = $("msgs").querySelector(".empty");
  if (empty) empty.remove();
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  $("msgs").appendChild(d);
  down();
  return d;
}

/* ---------- Voz (Fish Audio) ---------- */
function unlock() { try { player.src = SILENT; player.play().catch(() => {}); } catch (e) {} }

async function fetchVoice(text) {
  const key = load("ultron_fkey", "");
  if (!key) throw new Error("Falta a chave do Fish Audio em Ajustes.");
  const body = { text, format: "mp3" };
  const voice = load("ultron_fvoice", "");
  if (voice) body.reference_id = voice;
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 20000);
  try {
    const r = await fetch("https://api.fish.audio/v1/tts", {
      method: "POST",
      signal: ctrl.signal,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json", "model": load("ultron_fmodel", DEFAULT_FMODEL) },
      body: JSON.stringify(body)
    });
    if (!r.ok) { const t = await r.text(); throw new Error("Fish " + r.status + ": " + t.slice(0, 140)); }
    return URL.createObjectURL(await r.blob());
  } catch (e) {
    if (e.name === "AbortError") throw new Error("O Fish demorou demais para responder.");
    if (e instanceof TypeError) throw new Error("O navegador não conseguiu falar com o Fish (bloqueio ou sem internet).");
    throw e;
  } finally { clearTimeout(to); }
}

function play(url, onend) {
  player.onended = onend || null;
  player.onerror = onend || null;
  player.src = url;
  player.play().catch(() => { if (onend) onend(); });
}

function addEar(el, text, url, err) {
  if (err) {
    const n = document.createElement("span");
    n.className = "note";
    n.textContent = "Áudio indisponível: " + err;
    el.appendChild(n);
  }
  if (!load("ultron_fkey", "")) return;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ear";
  b.textContent = url ? "Ouvir de novo" : "Ouvir";
  b.onclick = async () => {
    b.disabled = true;
    try {
      if (!url) { b.textContent = "Gerando voz…"; url = await fetchVoice(text); }
      play(url);
      b.textContent = "Ouvir de novo";
    } catch (e) { b.textContent = e.message; }
    b.disabled = false;
  };
  el.appendChild(b);
  down();
}

/* ---------- Animações ---------- */
function startThinking(el) {
  const steps = ["Analisando", "Calculando", "Refletindo"];
  el.innerHTML = '<span class="st"></span><span class="d"><i></i><i></i><i></i></span>';
  const st = el.querySelector(".st");
  let i = 0;
  st.textContent = steps[0];
  const id = setInterval(() => { i = (i + 1) % steps.length; st.textContent = steps[i]; }, 1500);
  return () => clearInterval(id);
}

function typeInto(el, text, done) {
  if (REDUCED) { el.textContent = text; done(); return; }
  const v = document.createElement("span"), h = document.createElement("span");
  v.className = "v"; h.className = "h";
  h.textContent = text;
  el.textContent = "";
  el.append(v, h);
  const total = text.length;
  const dur = Math.min(total * 18, 5000);
  const t0 = performance.now();
  function step(now) {
    const n = Math.min(total, Math.floor((now - t0) / dur * total));
    v.textContent = text.slice(0, n);
    h.textContent = text.slice(n);
    down();
    if (n < total) requestAnimationFrame(step);
    else { el.textContent = text; done(); }
  }
  requestAnimationFrame(step);
}

/* ---------- Ajustes e conversa ---------- */
$("bset").onclick = () => $("settings").classList.toggle("open");
$("bsave").onclick = () => { saveSettings(); $("tmsg").textContent = ""; $("settings").classList.remove("open"); };
$("btest").onclick = async () => {
  unlock();
  saveSettings();
  $("tmsg").textContent = "Gerando a voz…";
  try {
    const url = await fetchVoice(SAMPLE);
    play(url);
    $("tmsg").textContent = "Funcionou. Você deve estar ouvindo a voz.";
  } catch (e) { $("tmsg").textContent = "Erro. " + e.message; }
};
$("bclear").onclick = () => { if (busy) return; history = []; showEmpty(); };

async function ask(text) {
  const key = load("ultron_key", "");
  if (!key) { $("settings").classList.add("open"); add("u", text); add("a err", "Falta a chave da API do Gemini. Cole-a em Ajustes."); return; }
  busy = true;
  history.push({ role: "user", text });
  add("u", text);
  const wait = add("a thinking", "");
  const stop = startThinking(wait);
  $("eye").classList.add("busy");
  try {
    const model = load("ultron_model", DEFAULT_MODEL);
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: load("ultron_sys", DEFAULT_SYS) }] },
        contents: history.map(h => ({ role: h.role, parts: [{ text: h.text }] })),
        generationConfig: { maxOutputTokens: 1024 }
      })
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error.code + ": " + data.error.message);
    const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const reply = parts.filter(p => p.text && !p.thought).map(p => p.text).join("").trim();
    if (!reply) throw new Error("O Gemini respondeu sem texto. Tente de novo.");
    history.push({ role: "model", text: reply });

    let voiceUrl = null, voiceErr = null;
    if (load("ultron_speak", "1") === "1" && load("ultron_fkey", "")) {
      try { voiceUrl = await fetchVoice(reply); } catch (e) { voiceErr = e.message; }
    }
    stop();
    wait.className = "a";
    $("eye").classList.remove("busy");
    $("eye").classList.add("speak");
    let pending = voiceUrl ? 2 : 1;
    const fin = () => { pending--; if (pending <= 0) $("eye").classList.remove("speak"); };
    if (voiceUrl) play(voiceUrl, fin);
    typeInto(wait, reply, () => { addEar(wait, reply, voiceUrl, voiceErr); fin(); busy = false; });
  } catch (e) {
    history.pop();
    stop();
    wait.className = "a err";
    wait.textContent = "Erro. " + e.message;
    $("eye").classList.remove("busy");
    busy = false;
    down();
  }
}

$("f").onsubmit = e => {
  e.preventDefault();
  if (busy) return;
  const t = $("q").value.trim();
  if (!t) return;
  unlock();
  $("q").value = "";
  $("q").style.height = "auto";
  ask(t);
};
$("q").oninput = () => { $("q").style.height = "auto"; $("q").style.height = Math.min($("q").scrollHeight, 120) + "px"; };

if (window.visualViewport) {
  const fit = () => { document.body.style.height = window.visualViewport.height + "px"; window.scrollTo(0, 0); down(); };
  window.visualViewport.addEventListener("resize", fit);
  fit();
}
showEmpty();
</script>
</body>
</html>
